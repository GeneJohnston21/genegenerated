[build]
  command = "node tools/build-pages.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/*.json"]

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/booth"
  to = "/booth.html"
  status = 200

[[redirects]]
  from = "/design"
  to = "/design.html"
  status = 200

[[redirects]]
  from = "/custom"
  to = "/custom.html"
  status = 200

# Repo files that aren't part of the site: don't serve them.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
